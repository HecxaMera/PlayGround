<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#9de3d5">
<title>Pond Pals</title>
<style>
:root{--ink:#174450;--cream:#fff8e9;--coral:#ff806d;--mint:#83d9bf;--sun:#ffca68;--deep:#258c91}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink);background:#9de3d5}button{font:inherit;color:inherit;border:0;cursor:pointer}#pond{position:absolute;inset:0;touch-action:manipulation}canvas{display:block;width:100%;height:100%}.grain{position:absolute;inset:0;pointer-events:none;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E")}
.topbar{position:absolute;top:20px;left:22px;right:22px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;gap:12px}.brand,.counter,.sound{pointer-events:auto;background:rgba(255,250,235,.9);box-shadow:0 7px 0 rgba(26,104,111,.12),0 12px 30px #227d8050;backdrop-filter:blur(12px);border:2px solid #fff9e2;border-radius:22px}.brand{padding:10px 18px;font-size:15px;letter-spacing:.08em;font-weight:1000;text-transform:uppercase;display:flex;align-items:center;gap:9px}.brand .icon{font-size:23px}.balance{position:absolute;left:50%;transform:translateX(-50%);top:0;min-width:176px;text-align:center;padding:11px 22px 10px;background:var(--cream);border-radius:24px;border:3px solid white;box-shadow:0 8px 0 #338d8850,0 12px 28px #226e7650}.balance strong{display:block;font-size:clamp(23px,3vw,34px);line-height:1;font-weight:1000;letter-spacing:-.04em}.balance span{font-size:10px;font-weight:900;letter-spacing:.2em;color:#6b9993}.sound{width:46px;height:46px;font-size:19px}
.shop{position:absolute;right:22px;top:94px;width:min(298px,calc(100vw - 32px));display:flex;flex-direction:column;gap:9px;max-height:calc(100vh - 180px);overflow:auto;padding:2px 6px 6px 2px;scrollbar-width:none}.shop::-webkit-scrollbar{display:none}.shop-title{align-self:flex-end;padding:6px 14px;border-radius:15px;background:#fff8e9d9;font-size:10px;letter-spacing:.2em;font-weight:1000;box-shadow:0 4px 0 #328a8050}.buy-card{position:relative;text-align:left;width:100%;min-height:77px;border:2px solid #fff9e7;border-radius:21px;padding:10px 12px;background:rgba(255,249,231,.92);box-shadow:0 6px 0 rgba(34,112,111,.18),0 10px 22px #23767a38;display:flex;align-items:center;gap:11px;transition:transform .16s,opacity .2s,filter .2s;overflow:hidden}.buy-card:active{transform:translateY(4px) scale(.98);box-shadow:0 2px 0 #267b7850}.buy-card.locked{opacity:.62;filter:saturate(.62)}.buy-card.afford{border-color:white;box-shadow:0 6px 0 #36a98975,0 10px 22px #23767a38}.item-icon{width:47px;height:47px;border-radius:16px;background:#d8f1db;display:grid;place-items:center;font-size:28px;flex-shrink:0}.item-info{min-width:0;flex:1}.item-info b{display:block;font-weight:1000;font-size:14px;line-height:1.15}.item-info small{font-weight:750;font-size:10px;color:#71928b;display:block;margin-top:4px;white-space:nowrap}.price{border-radius:12px;background:#ffcd70;padding:7px 8px;font-size:11px;font-weight:1000;white-space:nowrap}.qty{position:absolute;right:10px;top:6px;font-size:9px;color:#538a7e;font-weight:900}.bottom{position:absolute;bottom:18px;left:22px;right:22px;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}.bottom>*{pointer-events:auto}.hint{background:#fff8e9d9;padding:10px 15px;border-radius:16px;font-size:11px;font-weight:800;box-shadow:0 5px 0 #36878050}.hint b{color:#ed7668}.stats{display:flex;gap:8px}.stat{padding:10px 13px;background:#fff8e9df;border-radius:15px;font-size:10px;font-weight:900;box-shadow:0 5px 0 #36878050;white-space:nowrap}.stat strong{font-size:13px;margin-right:4px}.tap-ring{position:absolute;left:50%;top:52%;width:180px;height:180px;transform:translate(-50%,-50%);border:2px solid #fff8;box-shadow:0 0 40px #fff6,inset 0 0 30px #fff4;border-radius:50%;opacity:0;pointer-events:none}.tap-ring.pop{animation:ring .65s ease-out}@keyframes ring{0%{opacity:.8;transform:translate(-50%,-50%) scale(.55)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}}.toast{position:absolute;top:22%;left:50%;transform:translate(-50%,-8px);padding:11px 17px;border-radius:17px;background:#fff9e8;font-size:13px;font-weight:1000;box-shadow:0 5px 0 #328b8050;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.bubble{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.14em;font-weight:1000;color:white;text-shadow:0 2px 8px #217d85;opacity:.85;pointer-events:none}
@media(max-width:700px){.topbar{top:12px;left:12px;right:12px}.brand{padding:8px 11px;font-size:11px;border-radius:17px}.brand .icon{font-size:18px}.balance{min-width:112px;padding:9px 10px;border-radius:18px;top:3px}.balance strong{font-size:20px}.balance span{font-size:8px}.sound{width:40px;height:40px}.shop{top:auto;bottom:92px;left:12px;right:12px;width:auto;max-height:none;display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:0 0 7px;gap:8px}.shop-title{display:none}.buy-card{width:164px;min-width:164px;min-height:67px;padding:8px;border-radius:17px;gap:7px}.item-icon{width:38px;height:38px;font-size:23px;border-radius:13px}.item-info b{font-size:12px}.item-info small{font-size:9px}.price{font-size:10px;padding:6px}.qty{top:3px;right:7px}.bottom{bottom:13px;left:12px;right:12px;align-items:center}.hint{font-size:10px;padding:9px 11px}.stats{gap:5px}.stat{font-size:9px;padding:9px 8px}.stat strong{font-size:11px}.bubble{bottom:174px}.toast{top:19%}}
@media(max-width:390px){.hint{max-width:145px}.stat:last-child{display:none}.brand{font-size:10px}.buy-card{width:150px;min-width:150px}}
</style>
</head>
<body>
<div id="pond"></div><div class="grain"></div>
<header class="topbar"><div class="brand"><span class="icon">🐟</span> POND PALS</div><div class="balance"><strong id="fish">0</strong><span>FISH CAUGHT</span></div><button class="sound" id="sound" aria-label="Toggle sound">♫</button></header>
<section class="shop" id="shop"><div class="shop-title">LITTLE HELPERS</div></section>
<div class="tap-ring" id="ring"></div><div class="toast" id="toast"></div><div class="bubble">TAP THE FISH TO CATCH IT ✨</div>
<footer class="bottom"><div class="hint">A little <b>tap</b>, a lot of fish.</div><div class="stats"><div class="stat"><strong id="rate">0</strong> / sec</div><div class="stat"><strong id="total">0</strong> helpers</div></div></footer>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const host=document.querySelector('#pond'), fishLabel=document.querySelector('#fish'), rateLabel=document.querySelector('#rate'), totalLabel=document.querySelector('#total'), shop=document.querySelector('#shop'), ring=document.querySelector('#ring'), toast=document.querySelector('#toast');
const defs=[{id:'pup',name:'Baby otter',icon:'🦦',cost:18,rate:1.2,desc:'A tiny fish finder'},{id:'buddy',name:'Otter buddies',icon:'🦦',cost:110,rate:6,desc:'Double the splashing'},{id:'family',name:'Otter family',icon:'🦦',cost:620,rate:32,desc:'A whole happy raft'},{id:'net',name:'Shiny net',icon:'✨',cost:55,click:2,desc:'More fish per tap'}];
let save;try{save=JSON.parse(localStorage.pondPals||'{}')}catch{save={}};
const game={fish:Math.max(0,save.fish||0),total:Math.max(0,save.total||0),counts:Object.assign({pup:0,buddy:0,family:0,net:0},save.counts||{}),tap:1};
function rate(){return defs.reduce((n,d)=>n+(d.rate||0)*game.counts[d.id],0)}function power(){return 1+game.counts.net*2}function helperCount(){return game.counts.pup+game.counts.buddy+game.counts.family}
function compact(n){if(n<1000)return Math.floor(n).toLocaleString();const units=['K','M','B','T'];let i=-1;do{n/=1000;i++}while(n>=1000&&i<units.length-1);return n.toFixed(n<10?1:0)+units[i]}
function saveGame(){try{localStorage.pondPals=JSON.stringify({fish:game.fish,total:game.total,counts:game.counts})}catch{}}
function ui(){fishLabel.textContent=compact(game.fish);rateLabel.textContent=compact(rate());totalLabel.textContent=compact(helperCount());for(const d of defs){const btn=document.querySelector('#buy-'+d.id);let price=Math.floor(d.cost*Math.pow(1.16,game.counts[d.id]));btn.querySelector('.price').textContent='🐟 '+compact(price);btn.classList.toggle('afford',game.fish>=price);btn.classList.toggle('locked',game.fish<price);btn.querySelector('.qty').textContent='×'+game.counts[d.id]}}
for(const d of defs){const card=document.createElement('button');card.className='buy-card';card.id='buy-'+d.id;card.innerHTML=`<span class="item-icon">${d.icon}</span><span class="item-info"><b>${d.name}</b><small>${d.desc}</small></span><span class="price">🐟 ${d.cost}</span><span class="qty">×0</span>`;card.addEventListener('click',()=>buy(d));shop.append(card)}
let toastTimer;function message(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1250)}
function buy(d){const price=Math.floor(d.cost*Math.pow(1.16,game.counts[d.id]));if(game.fish<price){message('A few more fish!');return}game.fish-=price;game.counts[d.id]++;if(d.id==='net')message('✨ Shiny net!');else message('🦦 New otter friend!');addOtter();ui();saveGame()}

const scene=new THREE.Scene();scene.background=new THREE.Color('#a9e3d2');scene.fog=new THREE.Fog('#a9e3d2',18,42);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);camera.position.set(0,8.5,17.5);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.02;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight('#eaffec','#367b79',1.55));const sun=new THREE.DirectionalLight('#fff2cf',2.4);sun.position.set(-5,12,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,rough=.8)=>new THREE.MeshStandardMaterial({color,roughness:rough,flatShading:true});
const waterMat=new THREE.MeshStandardMaterial({color:'#53bdb3',roughness:.36,metalness:.03,flatShading:true});
const floor=new THREE.Mesh(new THREE.CircleGeometry(22,48),mat('#6fc6a9'));floor.rotation.x=-Math.PI/2;floor.position.y=-1.35;floor.receiveShadow=true;scene.add(floor);
const pond=new THREE.Mesh(new THREE.CircleGeometry(8.7,36),waterMat);pond.rotation.x=-Math.PI/2;pond.position.y=-1.05;pond.receiveShadow=true;scene.add(pond);
const rim=new THREE.Mesh(new THREE.TorusGeometry(8.65,.24,5,52),mat('#f3d695'));rim.rotation.x=Math.PI/2;rim.position.y=-1.02;scene.add(rim);
for(let i=0;i<5;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(1.4+i*.84,.025,4,50),new THREE.MeshStandardMaterial({color:'#d0fff0',transparent:true,opacity:.18,roughness:.3}));r.rotation.x=Math.PI/2;r.position.set((i%2?-.7:.7),-.9-i*.001,0);r.scale.y=.74;scene.add(r)}
// Soft stepping stones and little shoreline plants make the pond feel like a tiny diorama.
for(let i=0;i<19;i++){const a=i/19*Math.PI*2;const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.42+(i%3)*.1,0),mat(i%2?'#f7d99b':'#f9e8bd'));rock.position.set(Math.cos(a)*9.25,-1.02,Math.sin(a)*7.4);rock.scale.set(1,.52,.78);rock.rotation.y=a;rock.castShadow=true;scene.add(rock)}
const reeds=[];for(let i=0;i<18;i++){const a=i*2.4;const x=Math.cos(a)*(9.8+(i%3)*.6),z=Math.sin(a)*(7.8+(i%4)*.5);const g=new THREE.Group();g.position.set(x,-.95,z);for(let j=0;j<3;j++){const leaf=new THREE.Mesh(new THREE.ConeGeometry(.12,.95+(j%2)*.3,4),mat(j%2?'#479d73':'#67b77c'));leaf.position.set((j-1)*.18,.45,-j*.12);leaf.rotation.z=(j-1)*-.25;g.add(leaf)}scene.add(g);reeds.push(g)}
// Decorative flowers and floating lily pads.
for(let i=0;i<9;i++){let a=i*2.39;const pad=new THREE.Mesh(new THREE.CircleGeometry(.65,7),mat(i%2?'#77cb9c':'#95d59f'));pad.rotation.x=-Math.PI/2;pad.position.set(Math.cos(a)*6.5,-1.005,Math.sin(a)*5.3);pad.scale.set(1,.8,1);scene.add(pad);if(i%3===0){const f=new THREE.Mesh(new THREE.DodecahedronGeometry(.2,0),mat('#ffe7a4'));f.position.set(pad.position.x,-.82,pad.position.z);scene.add(f)}}
function ellipsoid(parent,color,pos,scale,geo=new THREE.IcosahedronGeometry(1,1)){const m=new THREE.Mesh(geo,mat(color));m.position.set(...pos);m.scale.set(...scale);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function makeFish(color='#f58a69',scale=1){const g=new THREE.Group();const body=ellipsoid(g,color,[0,0,0],[.9,.52,.39]);const tail=new THREE.Mesh(new THREE.ConeGeometry(.52,.75,3),mat(color));tail.rotation.z=-Math.PI/2;tail.position.x=-.89;tail.scale.set(1,.9,.42);tail.castShadow=true;g.add(tail);const dorsal=ellipsoid(g,'#ffd079',[-.04,.45,0],[.36,.17,.22],new THREE.ConeGeometry(1,1,4));dorsal.rotation.z=.35;const fin=ellipsoid(g,'#ffb178',[-.05,-.36,.18],[.31,.13,.12],new THREE.ConeGeometry(1,1,4));fin.rotation.z=-.4;
ellipsoid(g,'#fff6db',[.43,.12,.32],[.16,.16,.08],new THREE.IcosahedronGeometry(1,1));ellipsoid(g,'#264e57',[.48,.13,.395],[.075,.085,.045],new THREE.IcosahedronGeometry(1,0));const glint=ellipsoid(g,'#ffffff',[.5,.17,.43],[.025,.028,.018],new THREE.IcosahedronGeometry(1,0));g.scale.setScalar(scale);g.userData.body=body;return g}
const fish=makeFish('#f58a69',1.15);fish.position.set(0,.1,0);scene.add(fish);
// Otters are little faceted shore guardians, each with a soft belly and a fish snack.
const otters=[];const fur=['#aa8064','#cb9b73','#8c725f','#d3a47e'];
function makeOtter(index){const g=new THREE.Group(),c=fur[index%fur.length];ellipsoid(g,c,[0,.02,0],[.46,.65,.38]);ellipsoid(g,'#f3d9b2',[0,-.11,.31],[.29,.43,.12]);ellipsoid(g,c,[0,.61,.02],[.43,.4,.36]);for(const x of [-.31,.31]){ellipsoid(g,c,[x,.91,0],[.17,.17,.13],new THREE.IcosahedronGeometry(1,0));ellipsoid(g,'#edb6a5',[x,.91,.11],[.09,.09,.045],new THREE.IcosahedronGeometry(1,0));ellipsoid(g,'#fff3d8',[x*.62,.62,.34],[.12,.14,.08],new THREE.IcosahedronGeometry(1,0));ellipsoid(g,'#294c51',[x*.62,.62,.405],[.055,.075,.035],new THREE.IcosahedronGeometry(1,0))}ellipsoid(g,'#55453d',[0,.48,.43],[.095,.065,.06],new THREE.IcosahedronGeometry(1,0));ellipsoid(g,'#f1a294',[0,.40,.45],[.06,.035,.025],new THREE.IcosahedronGeometry(1,0));for(const x of [-.23,.23])ellipsoid(g,c,[x,-.22,.28],[.15,.12,.14]);ellipsoid(g,c,[0,-.35,-.3],[.17,.2,.3]);const snack=makeFish('#ffc66b',.18);snack.position.set(.03,-.08,.46);g.add(snack);g.position.y=-.7;g.userData.phase=Math.random()*6;scene.add(g);otters.push(g);return g}
function layoutOtters(){otters.forEach((o,i)=>{if(innerWidth<700){o.position.x=((i%3)-1)*1.5;o.position.z=1.6+Math.floor(i/3)*.4;o.rotation.y=-.12+(i%3)*.12}else{const a=1.95+(i%6)*.2;o.position.x=Math.cos(a)*(6.6-Math.floor(i/6)*.45);o.position.z=Math.sin(a)*(3.45-Math.floor(i/6)*.25);o.rotation.y=-.18+(i%3)*.18}})}
function addOtter(){if(otters.length>=12)return;makeOtter(otters.length);layoutOtters()}
for(let i=0;i<Math.min(12,helperCount());i++)addOtter();
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let clickBoost=0;
function catchFish(event){const rect=renderer.domElement.getBoundingClientRect();pointer.x=(event.clientX-rect.left)/rect.width*2-1;pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);if(raycaster.intersectObject(fish,true).length){game.fish+=power();game.total+=power();clickBoost=1;ring.classList.remove('pop');void ring.offsetWidth;ring.classList.add('pop');message('+'+power()+' fish!');ui();saveGame();for(let i=0;i<4;i++)spawnSpark(event.clientX,event.clientY)} }
renderer.domElement.addEventListener('pointerdown',catchFish);
function spawnSpark(x,y){const el=document.createElement('span');el.textContent=['✦','🐟','✧'][Math.floor(Math.random()*3)];el.style.cssText=`position:fixed;left:${x}px;top:${y}px;z-index:5;pointer-events:none;color:#fff4b6;font-size:${14+Math.random()*12}px;font-weight:bold;text-shadow:0 2px 6px #327c78;transition:transform .65s ease-out,opacity .65s;`;document.body.appendChild(el);requestAnimationFrame(()=>{el.style.transform=`translate(${Math.random()*90-45}px,${-40-Math.random()*55}px) rotate(${Math.random()*80-40}deg)`;el.style.opacity=0});setTimeout(()=>el.remove(),700)}
const swimmers=[];for(let i=0;i<5;i++){const f=makeFish(['#ffd173','#82c8bc','#fff0ca','#f2a17a','#b5a2dc'][i],.31+(i%2)*.08);f.position.set(Math.sin(i*9)*5,-.35+Math.random()*.15,Math.cos(i*7)*4);f.userData.swim=i*1.7;scene.add(f);swimmers.push(f)}
// A few softly bobbing bubbles catch the sun around the edges.
const bubbles=[];for(let i=0;i<11;i++){const b=new THREE.Mesh(new THREE.IcosahedronGeometry(.08+(i%3)*.035,1),new THREE.MeshStandardMaterial({color:'#e4fff0',transparent:true,opacity:.38,roughness:.2}));b.position.set(Math.sin(i*7)*7,-.35,Math.cos(i*4)*6);scene.add(b);bubbles.push(b)}
let last=performance.now(),saveTick=0,elapsed=0;
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000);last=now;elapsed+=dt;saveTick+=dt;game.fish+=rate()*dt;game.total+=rate()*dt;fish.position.y=.12+Math.sin(elapsed*2.15)*.15;fish.rotation.y=Math.sin(elapsed*.8)*.07;fish.rotation.z=Math.sin(elapsed*2.1)*.025;fish.scale.setScalar(1.15+Math.sin(elapsed*4)*.018);fish.children[1].rotation.z=-Math.PI/2+Math.sin(elapsed*11)*.13;
for(let i=0;i<swimmers.length;i++){const f=swimmers[i],t=elapsed*.35+f.userData.swim;f.position.x=Math.sin(t)*5.7;f.position.z=Math.cos(t)*4.5;f.position.y=-.39+Math.sin(t*2)*.08;f.rotation.y=Math.sin(t+Math.PI/2)>0?Math.PI:0;f.children[1].rotation.z=-Math.PI/2+Math.sin(elapsed*8+i)*.14}
otters.forEach((o,i)=>{o.position.y=-.78+Math.sin(elapsed*2+o.userData.phase)*.045;o.rotation.z=Math.sin(elapsed*1.5+o.userData.phase)*.025});bubbles.forEach((b,i)=>{b.position.y=-.55+((elapsed*.34+i*.19)%1.3);b.scale.setScalar(.7+Math.sin(elapsed*2+i)*.2)});reeds.forEach((r,i)=>r.rotation.z=Math.sin(elapsed*1.3+i)*.035);if(clickBoost>0)clickBoost=Math.max(0,clickBoost-dt*2.5);
renderer.render(scene,camera);if(Math.floor(elapsed*5)%2===0){fishLabel.textContent=compact(game.fish);rateLabel.textContent=compact(rate())}if(saveTick>5){saveTick=0;saveGame()}}
requestAnimationFrame(animate);
function resize(){camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<700?39:36;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);layoutOtters()}addEventListener('resize',resize);
let audioOn=false,audioCtx;document.querySelector('#sound').addEventListener('click',()=>{audioOn=!audioOn;document.querySelector('#sound').textContent=audioOn?'♫':'♪';message(audioOn?'Sound on':'Sound off')});
// Gentle synthesized plip, only after opting in.
renderer.domElement.addEventListener('pointerdown',()=>{if(!audioOn)return;try{audioCtx??=new AudioContext();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(660,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(980,audioCtx.currentTime+.09);g.gain.setValueAtTime(.055,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.15);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.16)}catch{}});
ui();animate(performance.now());
</script>
</body>
</html>
