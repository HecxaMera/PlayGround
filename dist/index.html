<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c9e6df" />
  <meta name="description" content="A tiny, cozy ocean. Catch fish and build an otter crew." />
  <link rel="icon" href="data:," />
  <title>Little Tide — Otterly good fishing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}
  </script>
  <script type="module" src="/game.js"></script>
</head>
<body>
  <main class="game-shell">
    <canvas id="ocean" aria-label="A little low-poly ocean with fish and otters"></canvas>
    <div class="water-wash"></div>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Little Tide home">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span class="brand-copy"><strong>little tide</strong><small>OTTERLY GOOD FISHING</small></span>
      </a>
      <div class="top-center"><span class="live-dot"></span> YOUR LITTLE OCEAN <span class="top-divider">·</span> <span id="ocean-level">DAY 01</span></div>
      <div class="top-actions">
        <button class="icon-button" id="sound-button" aria-label="Toggle sound" title="Toggle sound"><span id="sound-icon">♪</span></button>
        <div class="wallet"><span class="fish-coin">✦</span><span class="wallet-value" id="fish-count">0</span><span class="wallet-label">fish</span><span class="wallet-plus">+</span></div>
      </div>
    </header>

    <section class="world-hud" aria-label="Ocean stats">
      <div class="catch-card glass-card">
        <div class="eyebrow"><span class="eyebrow-icon">↗</span> YOUR CATCH</div>
        <div class="catch-number" id="catch-total">0</div>
        <div class="catch-foot"><span class="mini-fish">◆</span><span id="rate-label">0</span> <span>fish / sec</span></div>
        <div class="catch-progress"><span id="goal-fill"></span></div>
        <div class="goal-label"><span>next little helper</span><b id="goal-label">15 fish</b></div>
      </div>
      <div class="crew-chip glass-card"><div class="crew-avatars" id="crew-avatars"><span class="avatar avatar-one">ᵔᴥᵔ</span></div><div><strong id="crew-count">0</strong><span>otter crew</span></div><span class="crew-wave">⌁</span></div>
    </section>

    <div class="click-hint" id="click-hint"><span class="hint-spark">✦</span> tap the fish <span class="hint-spark">✦</span></div>
    <button class="fish-click" id="fish-click" aria-label="Catch a fish"><span class="click-ring"></span><span class="tap-ripple"></span></button>
    <div class="float-layer" id="float-layer" aria-hidden="true"></div>

    <div class="ocean-caption"><span class="caption-line"></span><span>A calm day in the cove</span><span class="caption-line"></span></div>

    <section class="shop-dock" aria-label="Otter shop">
      <div class="dock-heading"><div><span class="shop-sparkle">✳</span><span class="eyebrow">GROW YOUR CREW</span></div><span class="dock-note">They fish while you chill <span>☼</span></span></div>
      <div class="shop-grid" id="shop-grid">
        <button class="shop-card" data-tier="0">
          <span class="shop-art art-pebble"><span class="otter-face">ᵔᴥᵔ</span><span class="art-fish">✦</span></span>
          <span class="shop-info"><span class="shop-name">Pebble</span><span class="shop-desc">Little helper</span><span class="shop-buy"><span class="buy-cost">15</span><span class="fish-token">◆</span></span></span>
          <span class="owned-count">0</span>
        </button>
        <button class="shop-card" data-tier="1">
          <span class="shop-art art-moss"><span class="otter-face">ᵔᴥᵔ</span><span class="art-fish">✦</span></span>
          <span class="shop-info"><span class="shop-name">Moss</span><span class="shop-desc">Quick paws</span><span class="shop-buy"><span class="buy-cost">80</span><span class="fish-token">◆</span></span></span>
          <span class="owned-count">0</span>
        </button>
        <button class="shop-card" data-tier="2">
          <span class="shop-art art-bubbles"><span class="otter-face">ᵔᴥᵔ</span><span class="art-fish">✦</span></span>
          <span class="shop-info"><span class="shop-name">Bubbles</span><span class="shop-desc">Tide expert</span><span class="shop-buy"><span class="buy-cost">400</span><span class="fish-token">◆</span></span></span>
          <span class="owned-count">0</span>
        </button>
      </div>
    </section>
    <footer class="bottom-note"><span>✦</span> made for slow mornings <span class="footer-dot">·</span> <span id="save-status">saved</span></footer>
  </main>
</body>
</html>
